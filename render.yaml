# Render deployment topology for the CarthaPos demo.
# Services: backend (Docker) · frontend (static) · admin (static) · metabase (Docker)
# Databases: carthapos-db (app) · carthapos-warehouse-db (BI warehouse) · carthapos-metabase-db (Metabase)

databases:
  # Main app DB — kept paid (0.5c-1g) for reliability (licenses, clients, POS
  # config, BI templates). This is the most important/trafficked database.
  - name: carthapos-db
    databaseName: pos_system
    plan: 0.5c-1g
    region: oregon

  # BI data warehouse used by the ETL pipeline (Dim/Fact tables). Read by Metabase.
  # Free tier: 1 GB storage, 30-day expiry — fine for the demo.
  - name: carthapos-warehouse-db
    databaseName: pos_system_warehouse
    plan: free
    region: oregon

  # Metabase's own application database (dashboards, settings, users).
  # Free tier: 1 GB storage, 30-day expiry — fine for the demo.
  - name: carthapos-metabase-db
    databaseName: metabase
    plan: free
    region: oregon

services:
  # ======================================================================
  # Backend API (license management + POS generation + BI + Metabase proxy)
  # ======================================================================
  - type: web
    name: carthapos-backend
    runtime: docker
    region: oregon
    rootDir: .
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: carthapos-db
          property: connectionString
      - key: WAREHOUSE_DATABASE_URL
        fromDatabase:
          name: carthapos-warehouse-db
          property: connectionString
      # License signing keys (REQUIRED or backend refuses to start).
      # Private key is the backend/config/license-private.pem value (base64/PEM inline).
      - key: LICENSE_PRIVATE_KEY
        sync: false
      - key: LICENSE_PUBLIC_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: AUTH_REQUIRED
        value: "false"
      - key: CORS_ORIGINS
        value: "https://carthapos-admin.onrender.com,https://carthapos.onrender.com"
      - key: FRONTEND_URL
        value: https://carthapos.onrender.com
      - key: ADMIN_URL
        value: https://carthapos-admin.onrender.com
      # Metabase provisioning (backend calls Metabase REST API).
      - key: METABASE_BASE_URL
        value: https://carthapos-metabase.onrender.com
      - key: METABASE_PUBLIC_URL
        value: https://carthapos-metabase.onrender.com
      - key: METABASE_EMBED_ENABLED
        value: "true"
      - key: METABASE_USER
        sync: false
      - key: METABASE_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GENERATED_POS_PATH
        value: /app/generated-pos
      - key: NODE_OPTIONS
        value: "--max-old-space-size=450"

  # ======================================================================
  # Public website (landing, register, login)
  # ======================================================================
  - type: web
    name: carthapos-frontend
    runtime: static
    region: oregon
    rootDir: frontend
    buildCommand: npx pnpm install && npx pnpm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://carthapos-backend.onrender.com/api

  # ======================================================================
  # Admin panel (CarthaPos staff)
  # ======================================================================
  - type: web
    name: carthapos-admin
    runtime: static
    region: oregon
    rootDir: admin
    buildCommand: npx pnpm install && npx pnpm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://carthapos-backend.onrender.com/api

  # ======================================================================
  # Metabase (BI dashboards + admin analytics + client-embedded dashboards)
  # ======================================================================
  - type: web
    name: carthapos-metabase
    runtime: docker
    region: oregon
    dockerfilePath: metabase/Dockerfile
    rootDir: .
    dockerContext: .
    plan: free
    envVars:
      - key: MB_DB_TYPE
        value: postgres
      - key: MB_DB_DBNAME
        value: metabase
      - key: MB_DB_HOST
        fromDatabase:
          name: carthapos-metabase-db
          property: host
      - key: MB_DB_PORT
        fromDatabase:
          name: carthapos-metabase-db
          property: port
      - key: MB_DB_USER
        fromDatabase:
          name: carthapos-metabase-db
          property: user
      - key: MB_DB_PASS
        fromDatabase:
          name: carthapos-metabase-db
          property: password
      - key: MB_PORT
        value: "3000"
      # Optional but recommended once you create the embedding secret in Metabase UI.
      - key: MB_EMBEDDING_SECRET
        sync: false
