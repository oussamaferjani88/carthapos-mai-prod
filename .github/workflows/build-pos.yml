name: Build POS Windows Installer

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'POS Project Name (e.g., pos-restaurant-xyz)'
        required: true
      license_key:
        description: 'License Key'
        required: true
      business_name:
        description: 'Business Name'
        required: true
      branch:
        description: 'Branch to check out that contains the customized POS project'
        required: false
        default: 'main'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      # The backend pushes the fully-customized, generated project (selected modules,
      # design/theme, patched productName) to this branch BEFORE dispatching the
      # workflow, so we build exactly the folder the backend produced — no re-templating.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: generated-pos/${{ inputs.project_name }}/package-lock.json

      - name: Cache Electron/electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('generated-pos/${{ inputs.project_name }}/package-lock.json') }}

      - name: Install generated project dependencies
        working-directory: ./generated-pos/${{ inputs.project_name }}
        run: npm ci --legacy-peer-deps

      - name: Verify project files
        working-directory: ./generated-pos/${{ inputs.project_name }}
        run: |
          Write-Host "Files in project root:"
          Get-ChildItem -Name
          Write-Host "`nChecking public folder:"
          if (Test-Path "public") {
            Get-ChildItem "public" -Name
          } else {
            Write-Host "ERROR: public folder not found!"
            exit 1
          }
      
      # The backend writes the FULL customized config (modules, theme, license
      # key/public-key, DB filename, features) into public/app-config.json during
      # generation, and that file is pushed with the project. We must NOT overwrite
      # it here — doing so drops module selection, license validation and branding,
      # yielding a generic/broken installer. Just verify it survived checkout.
      - name: Verify customized app-config.json present
        working-directory: ./generated-pos/${{ inputs.project_name }}
        run: |
          if (Test-Path "public/app-config.json") {
            Write-Host "Customized app-config.json found"
            $cfg = Get-Content "public/app-config.json" -Raw | ConvertFrom-Json
            if ($cfg.theme -and $cfg.modules -and $cfg.security) {
              Write-Host "Config looks complete (theme present, $($cfg.modules.Count) modules, security present)"
            } else {
              Write-Host "WARNING: app-config.json is missing theme/modules/security - the installed app may be broken"
            }
          } else {
            Write-Host "ERROR: public/app-config.json not found in the pushed project!"
            exit 1
          }

      - name: Build Electron application
        working-directory: ./generated-pos/${{ inputs.project_name }}
        run: npm run build:electron
      
      - name: Find installer file
        id: find_installer
        working-directory: ./generated-pos/${{ inputs.project_name }}/release
        run: |
          $installer = Get-ChildItem -Filter "*.exe" | Select-Object -First 1
          echo "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          echo "installer_path=generated-pos/${{ inputs.project_name }}/release/$($installer.Name)" >> $env:GITHUB_OUTPUT
      
      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_name }}-installer
          path: ${{ steps.find_installer.outputs.installer_path }}
          retention-days: 90
